
name: CI-CD ProjetoIngles

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: CI - Validar projeto
    runs-on: ubuntu-latest

    steps:
      - name: Baixar código do repositório
        uses: actions/checkout@v4

      - name: Verificar arquivos do site
        run: |
          test -f index.html
          test -f style.css
          test -f garrafa1L.jpg
          test -f garrafa500ml.jpg
          echo "Arquivos do site encontrados!"

      - name: Validar configuração do Docker Compose
        run: docker compose config -q

      - name: Construir imagem Docker
        run: docker build -t projetoingles .

  deploy:
    name: CD - Publicar site
    needs: validate
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    permissions:
      contents: read
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Baixar código do repositório
        uses: actions/checkout@v4

      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5

      - name: Preparar arquivos para publicação
        uses: actions/upload-pages-artifact@v4
        with:
          path: .

      - name: Publicar site no GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
